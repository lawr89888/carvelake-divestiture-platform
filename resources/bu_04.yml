resources:
  pipelines:
    bu_04_pipeline:
      name: ${var.prefix}carvelake-bu-04
      serverless: true
      continuous: false

      catalog: ${var.prefix}shared
      target: bu_04

      libraries:
        - glob:
            include: ../pipelines/raw_bronze/bronze_pipeline.py
        - glob:
            include: ../pipelines/bronze_silver/silver_pipeline.py
        - glob:
            include: ../pipelines/silver_gold/gold_pipeline.py

      configuration:
        bu_id: bu_04
        shared_catalog: ${var.prefix}shared
        bu_catalog: ${var.prefix}bu_04